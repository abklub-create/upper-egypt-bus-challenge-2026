<div id="ue-game-live" class="w-full max-w-3xl mx-auto"><style>
#ue-game-live{
  --sand:#d7b47a;
  --sand2:#b8874d;
  --pap:#ead2a4;
  --dark:#1b120b;
  --dark2:#2a1b10;
  --gold:#d6a94b;

  --muted:#bfa37a;
  color:#f4e5c4;
  font-family:Georgia,"Times New Roman",serif;

  border:1px solid #604323;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
#ue-game-live .savebox{margin:16px 0;padding:14px;border:1px solid #806038;border-radius:14px;background:linear-gradient(145deg,rgba(91,60,28,.65),rgba(25,15,8,.8));color:#e8c984;text-align:center;line-height:1.55}#ue-game-live .again{background:linear-gradient(180deg,#342217,#1d1109);border-color:#72512d;color:#d8bd8c;font-size:13px}#ue-game-live .card{

  border:0;
  border-radius:0;
  padding:20px;
  min-height:640px;
  position:relative;
}
#ue-game-live .card:before{
  content:"☥  UPPER EGYPT EXPEDITION 2026  ☥";

  text-align:center;
  color:#d7b36b;

  font-size:10px;

}
.ey{
  margin-top:16px;

  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  font-weight:900;
  text-align:center;
}
.ttl{
  font-family:Georgia,"Times New Roman",serif;
  color:#f3d184;
  font-size:34px;
  font-weight:900;
  line-height:1.02;
  text-align:center;
  text-shadow:0 3px 12px #000;
  margin-top:7px;
}
.muted{color:#c7aa7c;line-height:1.5}
.route{

  border-radius:12px;
  background:rgba(20,12,7,.65);
  color:#cbb183;
  font-size:11px;
  text-align:center;
}
.pick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:18px 0;
}
.pick button,.answers button,.next,.again,.start,.custom button{
  min-height:52px;
  border:1px solid #805b32;
  border-radius:12px;
  background:linear-gradient(180deg,#3a2717,#20140b);
  color:#f2dfb6;
  font-weight:900;
  cursor:pointer;
  padding:10px 12px;
  box-shadow:inset 0 1px rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.25);
}
.pick button.active{
  border-color:#e1bb63;
  background:linear-gradient(180deg,#80602f,#4a3219);
  color:#fff0c8;
}
.start,.next,.again{
  width:100%;
  background:linear-gradient(180deg,#b98a3e,#795321);
  border-color:#e8c36e;
  color:#fff1c9;
  font-size:16px;
  letter-spacing:.04em;
  margin-top:12px;
}
.qtop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px;
  padding:10px 12px;
  border:1px solid #6e4c2b;
  border-radius:12px;
  background:rgba(18,11,7,.7);
}
.player{font-weight:900;color:#f0cf83}
.progress{
  height:8px;
  background:#1a1009;
  border:1px solid #614321;
  border-radius:99px;
  overflow:hidden;
  margin:11px 0 18px;
}
.bar{
  height:100%;
  background:linear-gradient(90deg,#9a6b2e,#f0cb72);
}
.question{
  background:
    linear-gradient(rgba(239,216,171,.96),rgba(218,181,116,.96));
  color:#24160b;
  border:2px solid #9a6c35;
  border-radius:17px;
  padding:24px 18px;
  font-size:22px;
  font-weight:900;
  line-height:1.3;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.answers{
  display:grid;
  gap:10px;
  margin-top:15px;
}
.answers button{
  text-align:left;
  background:linear-gradient(180deg,#3b2818,#21150c);
  border-color:#76532e;
  color:#f1dfb9;
  font-size:15px;
}
.answers button:hover{
  border-color:#d9ad59;
  background:#4a3119;
}
.answers button:disabled{cursor:default;opacity:.96}
.fb{
  min-height:30px;
  margin-top:12px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(14,9,5,.72);
  border:1px solid #654624;
  color:#f0d18a;
  font-weight:900;
}
.board{
  margin-top:20px;
  border-top:1px solid #654624;
  padding-top:14px;
}
.board h3{
  font-size:15px;
  color:#e0bc6b;
  margin:0 0 7px;
  text-transform:uppercase;
  letter-spacing:.1em;
}
.row{
  display:grid;
  grid-template-columns:32px 1fr auto;
  gap:8px;
  padding:8px 10px;
  margin:4px 0;
  border:1px solid transparent;
  border-radius:8px;
  font-size:14px;
}
.row:first-of-type{
  background:linear-gradient(90deg,rgba(190,145,57,.22),rgba(190,145,57,.05));
  border-color:#805f2e;
}
.row strong{color:#f1cc73}
.custom{display:flex;gap:8px}
.custom input{
  min-width:0;
  flex:1;
  border:1px solid #76532e;
  border-radius:10px;
  background:#1c1109;
  color:#f2dfb8;
  padding:11px;
  font-size:16px;
}
.winner{
  margin:20px 0;
  padding:22px;
  border:2px solid #d4a84f;
  border-radius:17px;
  background:linear-gradient(145deg,#4a3118,#20130a);
  color:#f3d27e;
  text-align:center;
  font-size:24px;
  font-weight:900;
}
@media(max-width:520px){
  #ue-game-live .card{padding:14px;min-height:600px}
  .pick{grid-template-columns:repeat(2,1fr)}
  .ttl{font-size:29px}
  .question{font-size:19px;padding:21px 14px}
  .answers button{min-height:54px}
}

    '<div class="progress"><div class="bar" style="width:'+((qi+1)/questions.length*100)+'%"></div></div>'+ 
    '<div class="turn"><span>🎙️ '+p+'</span><span>FORDULÓ '+roundNo+'</span></div>'+ 
    '<div class="questioncard"><div class="question">'+q+'</div></div>'+ 
    '<div class="answers">'+arr.map((x,i)=>'<button type="button" data-i="'+i+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+x+'</span></button>').join('')+'</div>'+ 
    '<div class="fb" id="fb" aria-live="polite"></div>'+board()+
    '<div class="navbuttons"><button type="button" class="prev" id="prev">← ELŐZŐ KÉRDÉS</button><button type="button" class="nextnav" id="nextnav">KÖVETKEZŐ KÉRDÉS →</button></div>';
  app.innerHTML=shell(content,'jatek');
  bindNavigation();
  app.querySelectorAll('[data-i]').forEach((btn,i)=>btn.addEventListener('click',()=>answer(arr[i],c)));
  app.querySelector('#prev').addEventListener('click',()=>{if(qi>0){qi--;render()}});
  app.querySelector('#nextnav').addEventListener('click',()=>{if(answered){qi++;render()}else{app.querySelector('#fb').textContent='Előbb válassz egy választ.'}});
}
function answer(chosen,correct){
  if(answered)return; answered=true;
  const p=P[qi%P.length],fb=app.querySelector('#fb');
  app.querySelectorAll('[data-i]').forEach(btn=>btn.disabled=true);
  if(chosen===correct){scores[p]++;fb.textContent='✓ HELYES! +1 PONT';fb.className='fb ok'}
  else{fb.textContent='✗ NEM EZ VOLT. HELYES VÁLASZ: '+correct;fb.className='fb bad'}
  saveState();
  const n=document.createElement('button'); n.type='button'; n.className='next'; n.textContent=qi===questions.length-1?'VÉGEREDMÉNY':'KÖVETKEZŐ KÉRDÉS';
  n.addEventListener('click',()=>{saveState();qi++;render()}); fb.after(n);
}
function finish(){
  const a=P.map((p,i)=>({p,s:scores[p]||0,i})).sort((x,y)=>y.s-x.s||x.i-y.i);
  const content='<div class="sectionlabel">EXPEDÍCIÓS DÖNTŐ</div><div class="configtitle">🏆 VÉGEREDMÉNY</div><p class="muted center">'+questions.length+' kérdés · összesített pontszám</p><div class="winner">'+a[0].p+' — '+a[0].s+' PONT</div>'+board()+'<button type="button" class="start" id="again">KÖVETKEZŐ FORDULÓ / FOLYTATÁS</button><button type="button" class="again" id="fresh">ÚJ EXPEDÍCIÓ — NULLÁZÁS</button>';
  app.innerHTML=shell(content,'ranglista');
  bindNavigation();
  app.querySelector('#again').addEventListener('click',()=>{roundNo++;saveState();config()});
  app.querySelector('#fresh').addEventListener('click',()=>{if(confirm('Új expedíció induljon?')){reset();usedQuestions=new Set();roundNo=1;expeditionStarted=true;saveState();config()}});
}
bindNavigation();config()})();</script></div>

.hero:after{display:none}.heroart{display:none}.hero-content{display:none}
.mainwrap{display:grid;grid-template-columns:minmax(0,72%) minmax(180px,28%);gap:12px;padding:14px 16px 16px;background:linear-gradient(180deg,#3a2514 0%,#21140b 100%)}
.mainwrap>.sectionlabel,.mainwrap>.configtitle,.mainwrap>.center,.mainwrap>.muted,.mainwrap>.savebox,.mainwrap>.pick,.mainwrap>.custom,.mainwrap>.start,.mainwrap>.again,.mainwrap>.winner{grid-column:1/-1}
.sectionlabel{font-size:11px;letter-spacing:.22em;color:#d5aa57;text-align:center;font-weight:900}.configtitle{font-size:28px;text-align:center;font-weight:900;color:#f4dfb5;margin:4px 0 8px}.center{text-align:center}.muted{color:#cdb68d;line-height:1.5}
.savebox{background:#e9d0a0;color:#2a1a0e;border:2px solid #a97b3f;border-radius:12px;padding:12px;text-align:center;margin:4px 0;box-shadow:inset 0 0 0 1px #f5e3bd}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pick button,.custom button,.start,.again,.next{border:2px solid #d3a44f;border-radius:10px;background:linear-gradient(135deg,#3a2413,#17100b);color:#f5d993;font-weight:900;padding:12px 16px;box-shadow:0 5px 12px rgba(0,0,0,.25);cursor:pointer}
.pick button{min-height:48px;background:linear-gradient(#f8e7c3,#d9b77a);color:#2b1a0f}.pick button.active{background:linear-gradient(#d6a74c,#80511f);color:#fff;border-color:#f1d17c}
.custom{display:flex;gap:8px}.custom input{min-width:0;flex:1;border:2px solid #9f7235;border-radius:9px;background:#f8e8c8;color:#2b1a0f;padding:12px;font-size:16px}.start,.again{width:100%;margin-top:8px;min-height:52px}
.questionhead{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#f4dfb7,#e4c78f);border:2px solid #a8793b;border-radius:12px 12px 0 0;padding:12px 14px;color:#2b1a0f;box-shadow:0 5px 12px rgba(0,0,0,.22)}
.questionhead>div:first-child{display:flex;flex-direction:column}.questionhead .label{font-size:11px;letter-spacing:.18em}.questionhead strong{font-size:22px}.category{font-weight:900;font-size:13px;text-align:right;max-width:180px}
.progress{height:7px;background:#6c4a29;border:0;border-radius:0;overflow:hidden;margin:0}.bar{height:100%;background:linear-gradient(90deg,#9f6b27,#f1c85e)}
.turn{display:flex;justify-content:space-between;color:#e9c77f;font-size:11px;font-weight:900;padding:9px 4px;letter-spacing:.08em}
.questioncard{background:linear-gradient(180deg,rgba(244,224,185,.98),rgba(226,194,137,.98));border:2px solid #a8793b;border-radius:13px;box-shadow:0 10px 25px rgba(0,0,0,.3);padding:28px 18px;min-height:190px;display:flex;align-items:center;justify-content:center}
.question{font-size:clamp(18px,3.2vw,30px);font-weight:900;line-height:1.2;text-align:center;color:#24170e}
.answers{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}.answers button{min-height:58px;display:flex;align-items:center;gap:12px;text-align:left;border:2px solid #a77b3f;border-radius:12px;background:linear-gradient(180deg,#f8e8c8,#dfc18b);color:#24170e;font-weight:800;font-size:clamp(15px,2.3vw,20px);padding:9px 12px;cursor:pointer}
.answers button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.04)}.answers button:disabled{opacity:.82}.letter{flex:0 0 43px;height:43px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(#6c4319,#2b180b);color:#f3cf7b;border:2px solid #d7a64e;font-size:20px;font-weight:900}
.fb{min-height:38px;margin:9px 0;font-weight:900;color:#f5d998;padding:9px 12px;border-radius:8px}.fb.ok{background:#165b3c}.fb.bad{background:#7a2c27}
.board{grid-column:2;grid-row:1 / span 20;align-self:start;margin:0;background:linear-gradient(180deg,#2a1b10,#0e0906);border:3px solid #8f622c;border-radius:16px;padding:10px 10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.boardtitle{color:#f2d38b;font-size:clamp(13px,1.7vw,19px);font-weight:900;letter-spacing:.08em;padding:6px 5px 10px;border-bottom:1px solid #6f4a24;text-align:center}.boardtitle span{font-size:23px;margin-right:6px}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:5px;align-items:center;padding:8px 5px;margin:2px 0;border-bottom:1px solid #4c331b;font-size:clamp(11px,1.5vw,15px);color:#f7e8c8}.row:last-child{border-bottom:0}.row strong{font-size:clamp(13px,1.7vw,17px);color:#f3ce78}
.row.gold{background:rgba(201,146,46,.18);border-radius:7px}.row.silver{background:rgba(190,190,190,.12);border-radius:7px}.row.bronze{background:rgba(166,96,43,.15);border-radius:7px}.place{font-weight:900;color:#f0ca72;text-align:center}.name{font-weight:700}
.navbuttons{grid-column:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}.navbuttons button{min-height:58px;border-radius:10px;border:2px solid #8f642e;background:#20140c;color:#efd28b;font-weight:900;cursor:pointer}.navbuttons .nextnav{background:linear-gradient(135deg,#3b2513,#17100b)}
.winner{grid-column:1/-1;margin:14px 0;padding:20px;text-align:center;background:linear-gradient(135deg,#d6a64b,#6e4219);border:2px solid #f0d07b;border-radius:12px;color:#fff4d3;font-size:28px;font-weight:900}
.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);background:#0e0a07;border-top:2px solid #6e4b27;position:sticky;bottom:0;z-index:10}.navitem{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;cursor:pointer;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#b99b72;font-size:9px;letter-spacing:.08em;font-weight:800}.navicon{font-size:24px;line-height:1;color:#b99b72}.navitem.active{color:#f0c968}.navitem.active .navicon{color:#f0c968}
@media(max-width:700px){.hero{height:230px}.mainwrap{grid-template-columns:minmax(0,70%) minmax(0,30%);gap:8px;padding:9px}.questionhead{padding:9px 10px}.questionhead strong{font-size:18px}.questionhead .label{font-size:9px}.category{font-size:9px;max-width:110px}.questioncard{min-height:145px;padding:20px 10px}.question{font-size:18px}.answers button{min-height:54px;font-size:13px;padding:8px 7px;gap:7px}.letter{flex-basis:34px;height:34px;font-size:16px}.board{border-width:2px;padding:7px 6px}.boardtitle{font-size:11px;padding-bottom:7px}.row{grid-template-columns:22px 1fr auto;font-size:10px;padding:6px 2px}.row strong{font-size:12px}.place{font-size:11px}.navbuttons{gap:7px}.navbuttons button{min-height:48px;font-size:10px;padding:6px}.bottomnav .navitem{min-height:54px;font-size:7px}.navicon{font-size:18px}}
@media(max-width:380px){.hero{height:205px}.mainwrap{grid-template-columns:minmax(0,69%) minmax(0,31%);padding:7px;gap:6px}.question{font-size:17px}.answers button{min-height:50px;font-size:12px}.letter{flex-basis:31px;height:31px;font-size:15px}.row{font-size:10px}}
</style>

</body>
</html>
